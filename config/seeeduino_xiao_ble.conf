# ========================================
# Dongle: ZMK Split Central
# Overrides prospector_scanner shield defaults to act as keyboard central
# ========================================
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=3

# Fetch battery levels from both halves and report to host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_ZMK_KEYBOARD_NAME="Sofle"

# Virtual encoder — EC11 driver needed so ZMK compiles sensor support
# and can dispatch split sensor events from sofle_left to the keymap bindings
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
